<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EnhancedFX Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app" aria-hidden="true">
    <div class="backdrop"></div>
    <section class="shell" role="dialog" aria-modal="true" aria-label="EnhancedFX Admin">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><strong>ENHANCED<span>FX</span></strong><small>ADMINISTRATION</small></div>
        </div>
        <nav id="navigation" aria-label="Admin sections"></nav>
        <div class="sidebar-foot">
          <div class="live-dot"></div>
          <div><strong>SECURE SESSION</strong><small>ACE permissions active</small></div>
        </div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <div><p id="eyebrow">COMMAND CENTER</p><h1 id="pageTitle">Dashboard</h1></div>
          <div class="top-actions">
            <div class="server-pill"><span></span><div><small>CONNECTED TO</small><strong id="serverName">FiveM Server</strong></div></div>
            <button id="dockButton" class="icon-button" title="Dock menu" aria-label="Dock menu">›</button>
            <button id="refreshButton" class="icon-button" title="Refresh" aria-label="Refresh">↻</button>
            <button id="closeButton" class="icon-button close" title="Close" aria-label="Close">×</button>
          </div>
        </header>
        <div id="content" class="content"></div>
      </main>
    </section>
  </div>

  <div id="modal" class="modal-layer" aria-hidden="true"></div>
  <div id="announcement" class="announcement"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
